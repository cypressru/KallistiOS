# KallistiOS Toolchain Builder (kos-chain)

#########################
### TOOLCHAIN PROFILE ###
#########################

# Experimental original Xbox GNU cross-toolchain. KOS supplies its Xbox
# startup code and linker script separately; native XBE packaging is not yet
# integrated into the standard build workflow.
platform=xbox

# Choose a toolchain profile from the following available options:
# Release toolchains:
# - stable:       Stable: based on GCC 16.1.0, Binutils 2.46.1, and Newlib 4.6.0.
# Development toolchains:
# - 17.0.0-dev:   Bleeding edge GCC 17 series from git.
toolchain_profile=stable

########################
### DOWNLOAD OPTIONS ###
########################

download_protocol=https

#####################
### BUILD OPTIONS ###
#####################

# Persistent install prefix for the original Xbox cross toolchain.
toolchain_path=/opt/toolchains/xbox/i686-pc-xbox

makejobs=
verbose=1
erase=1

########################
### LANGUAGE OPTIONS ###
########################

enable_cpp=1
enable_objc=0
enable_objcpp=0

###################
### GCC OPTIONS ###
###################

# Use the KOS thread model provided by the Xbox architecture runtime.
thread_model=kos

######################
### NEWLIB OPTIONS ###
######################

# Enable C99 format support for the Xbox Newlib target.
newlib_c99_formats=1
